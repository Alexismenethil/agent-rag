[project]
name = "agente-rag-backend"
version = "0.1.0"
description = "Backend FastAPI del agente RAG sobre documentos (explica-PDF con cita exacta)"
requires-python = ">=3.11"

# --- Dependencias núcleo (V0/V1: API, BD, migraciones, LLM) ---
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",          # driver async de la app
  "psycopg[binary]>=3.2",   # driver sync para Alembic
  "alembic>=1.13",
  "pgvector>=0.3",          # tipo Vector para SQLAlchemy
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9", # subida de archivos (V1)
  "anthropic>=0.40",         # LLMProvider Claude (V1)
  "httpx>=0.27",
]

# --- Extras por versión (se instalan cuando toca, para no inflar la imagen V0) ---
[project.optional-dependencies]
rag = [                      # V1: ingesta + embeddings + reranker
  "docling>=2.0",
  "pymupdf>=1.24",
  "sentence-transformers>=3.0",
  "FlagEmbedding>=1.2",
]
voice = [                    # V3: voz local
  "faster-whisper>=1.0",
  "piper-tts>=1.2",
]
eval = [                     # V2: evaluación
  "ragas>=0.2",
  "datasets>=3.0",
  "pandas>=2.2",
]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
