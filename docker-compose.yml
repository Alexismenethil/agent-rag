# Pila de desarrollo: Postgres+pgvector, backend FastAPI, frontend Next.js.
# Arranque:  cp .env.example .env  &&  docker compose up --build -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de la red de compose el host de la BD es "db", no localhost.
      # La APP usa asyncpg; Alembic usa psycopg (modo síncrono).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_dev_pwd}@db:5432/${POSTGRES_DB:-rag}
      ALEMBIC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_dev_pwd}@db:5432/${POSTGRES_DB:-rag}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # hot-reload del código
      - ./models:/models        # pesos compartidos (BGE-m3, reranker, voz)
      - ./data:/data            # uploads, datasets, audio TTS
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules       # no sobreescribir node_modules del contenedor
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
